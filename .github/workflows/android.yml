# La app de Android, de prueba: cada vez que se sube algo a «desarrollo»,
# hace «Máster (prueba)» (otra app, que convive con la de verdad) y la deja
# en esta ejecución de Actions, en «Artifacts» → PantallaMaster-Android-prueba.
# La de verdad (firmada) la hace ejecutables.yml al subir a main.
name: android-prueba

on:
  push:
    branches: [desarrollo]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Construir
        env:
          VERSION_APP: ${{ github.sha }}
        run: |
          set -o pipefail
          gradle -p android assembleDebug --no-daemon --stacktrace 2>&1 | tee android-compilacion.log || {
            grep -E "error:|e: |What went wrong|> .*(failed|Could not)|Caused by" -A2 android-compilacion.log | head -45 \
              | sed 's/%/%25/g' | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          }
          cp android/app/build/outputs/apk/debug/app-debug.apk PantallaMaster-Android-prueba.apk
      - name: Comprobar que la web va dentro
        run: |
          A=PantallaMaster-Android-prueba.apk
          for f in assets/android.js assets/web/index.html assets/web/jugadores.html assets/web/reproductor.html assets/web/scripts/pantalla-master.js; do
            unzip -l "$A" "$f" >/dev/null || { echo "::error::Falta $f en el APK"; exit 1; }
          done
          if unzip -l "$A" | grep -qE "assets/web/(sw\.js|android/|lanzador/|herramientas/)"; then echo "::error::Sobra algo en el APK"; exit 1; fi
          echo "::notice::APK: $(unzip -l "$A" | grep -c ' assets/web/') archivos de la web, $(du -h "$A" | cut -f1)"
      - uses: actions/upload-artifact@v4
        with:
          name: PantallaMaster-Android-prueba
          path: PantallaMaster-Android-prueba.apk
          retention-days: 30
