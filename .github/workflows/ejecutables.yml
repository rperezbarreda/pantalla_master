# Cada vez que se sube algo a main, hace lo que se descarga y lo deja en la
# release «ultima» del repo (https://github.com/rperezbarreda/pantalla_master/releases/latest):
#   - los .zip de escritorio (el programa y su carpeta «archivos», para
#     Windows, macOS y Linux; ver herramientas/construir-ejecutables.py);
#   - la app de Android (PantallaMaster-Android.apk), firmada con la clave de
#     los secretos (ver LEEME). El .aab para Google Play queda en
#     «Artifacts» de la ejecución (PantallaMaster-Android-Play).
# El título de la release lleva la versión (la del archivo VERSION, «1.0»;
# también es el versionName de la app de Android) y el número de esta
# ejecución, que es el versionCode de la app: la app lo compara con el suyo
# al buscar actualizaciones (android/…/Red.java, que lee «versión N»).
name: ejecutables

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ¿Hay clave para firmar?
        id: clave
        env:
          ALMACEN: ${{ secrets.ANDROID_ALMACEN_BASE64 }}
        run: |
          if [ -z "$ALMACEN" ]; then
            echo "::warning::Sin los secretos ANDROID_* no se publica la app de Android (ver LEEME)."
            echo "hay=no" >> "$GITHUB_OUTPUT"
          else
            echo "$ALMACEN" | base64 -d > "$RUNNER_TEMP/publicar.jks"
            echo "hay=si" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-java@v5
        if: steps.clave.outputs.hay == 'si'
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        if: steps.clave.outputs.hay == 'si'
        with:
          gradle-version: "8.14.3"
      - name: Construir y firmar
        if: steps.clave.outputs.hay == 'si'
        env:
          ANDROID_ALMACEN: ${{ runner.temp }}/publicar.jks
          ANDROID_ALMACEN_CLAVE: ${{ secrets.ANDROID_ALMACEN_CLAVE }}
          ANDROID_ALIAS: ${{ secrets.ANDROID_ALIAS }}
          ANDROID_ALIAS_CLAVE: ${{ secrets.ANDROID_ALIAS_CLAVE }}
        run: |
          set -o pipefail
          export VERSION_APP="$(cat VERSION)"
          gradle -p android assembleRelease bundleRelease --no-daemon --stacktrace 2>&1 | tee android-compilacion.log || {
            grep -E "error:|e: |What went wrong|> .*(failed|Could not)|Caused by" -A2 android-compilacion.log | head -45 \
              | sed 's/%/%25/g' | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          }
          mkdir -p dist-android
          cp android/app/build/outputs/apk/release/app-release.apk dist-android/PantallaMaster-Android.apk
          cp android/app/build/outputs/bundle/release/app-release.aab PantallaMaster-Android-Play.aab
          rm -f "$ANDROID_ALMACEN"
      - name: Comprobar que la web va dentro
        if: steps.clave.outputs.hay == 'si'
        run: |
          A=dist-android/PantallaMaster-Android.apk
          for f in assets/android.js assets/web/index.html assets/web/jugadores.html assets/web/reproductor.html assets/web/scripts/pantalla-master.js; do
            unzip -l "$A" "$f" >/dev/null || { echo "::error::Falta $f en el APK"; exit 1; }
          done
          if unzip -l "$A" | grep -qE "assets/web/(sw\.js|android/|lanzador/|herramientas/)"; then echo "::error::Sobra algo en el APK"; exit 1; fi
          echo "::notice::APK: $(unzip -l "$A" | grep -c ' assets/web/') archivos de la web, $(du -h "$A" | cut -f1)"
      - uses: actions/upload-artifact@v4
        if: steps.clave.outputs.hay == 'si'
        with:
          name: android
          path: dist-android/
      - uses: actions/upload-artifact@v4
        if: steps.clave.outputs.hay == 'si'
        with:
          name: PantallaMaster-Android-Play
          path: PantallaMaster-Android-Play.aab
          retention-days: 90

  construir:
    needs: android
    # Aunque falle la de Android, los de escritorio se publican igual.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pillow y el icono de Windows
        run: |
          pip install pillow
          go install github.com/akavel/rsrc@v0.10.2
      - name: Construir
        run: python3 herramientas/construir-ejecutables.py
      - uses: actions/download-artifact@v4
        if: needs.android.result == 'success'
        continue-on-error: true
        with:
          name: android
          path: dist/
      - name: Publicar en la release «ultima»
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="$(cat VERSION)"
          gh release delete ultima --yes --cleanup-tag || true
          gh release create ultima dist/* --latest \
            --title "Pantalla de máster $V (versión ${{ github.run_number }})" \
            --notes "Baja el .zip de tu sistema, descomprímelo y abre «Pantalla de máster» con doble clic (junto a él va la carpeta «archivos»: déjalos juntos). Windows: PantallaMaster-Windows.zip. Mac: el de tu procesador (Apple Silicon = M1, M2…; si no, Intel). Linux: PantallaMaster-Linux.zip. Tablets Android: PantallaMaster-Android.apk (ábrelo en la tablet y permite instalar apps de esta fuente). Todo lo que hagas se guarda en tu dispositivo; funciona sin conexión."
